services:
  leasequeue:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - leasequeue-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  leasequeue-data:
