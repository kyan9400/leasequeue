name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build

      - name: Verify release
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest

      - name: Build artifacts
        run: python -m build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "LeaseQueue ${{ github.ref_name }}"
