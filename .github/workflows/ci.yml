name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag leasequeue:test .

      - name: Build Vercel image
        run: docker build --file Dockerfile.vercel --tag leasequeue:vercel .

      - name: Inspect Vercel runtime user
        run: test "$(docker run --rm --entrypoint=id leasequeue:vercel -u)" != "0"

      - name: Inspect runtime user
        run: test "$(docker run --rm --entrypoint=id leasequeue:test -u)" != "0"

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: leasequeue:test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test image
        run: |
          docker run --detach --name leasequeue-smoke --publish 18000:8000 leasequeue:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health/ready; then
              curl --fail --silent http://127.0.0.1:18000/api/stats | grep --quiet 'queued'
              curl --fail --silent http://127.0.0.1:18000/ | grep --quiet 'Work that survives the worker'
              exit 0
            fi
            sleep 1
          done
          docker logs leasequeue-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force leasequeue-smoke || true
